services:
  bitrix-mcp:
    build: .
    container_name: bitrix-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./bitrix_mcp:/app/bitrix_mcp
      - ./main.py:/app/main.py
      - ./data:/data
